[project]
name = "stock-dashboard"
version = "1.0.0"
description = "Streamlit dashboard for screening stocks by relative strength, technicals and option positioning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scott McGhee" }]
requires-python = ">=3.12"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
# Tested versions are pinned in uv.lock; the upper bounds keep `pip install .` safe.
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "plotly>=5.24,<7",
    "psycopg2-binary>=2.9.9,<3",
    "pyarrow>=17,<27",
    "scipy>=1.14,<2",
    "streamlit>=1.52,<2",
]

[project.scripts]
stock-dashboard = "stock_dashboard.__main__:main"
stock-dashboard-seed-demo = "stock_dashboard.demo.__main__:main"

[project.urls]
Repository = "https://github.com/scottmcghee/stock-dashboard"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
    "types-psycopg2>=2.9",
    # Seeds the integration-test database with the same synthetic market the demo uses.
    "rs-pipeline @ git+https://github.com/scottmcghee/rs-pipeline@37e9dbf2b517156991f484333677060a65df8210",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_dashboard"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PD", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
files = ["src", "research"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["plotly.*", "scipy.*", "testcontainers.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]  # fast failures first
addopts = "-ra --strict-markers"
markers = ["integration: needs Docker; starts a throwaway PostgreSQL container"]

[tool.coverage.run]
source = ["stock_dashboard"]
branch = true
# Page scripts run inside Streamlit's AppTest, which coverage can't trace; every
# page is exercised by tests/integration/test_pages.py instead. The entry points
# only hand over to Streamlit or the demo seeder.
omit = ["*/views/*", "*/app.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
