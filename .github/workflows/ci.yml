name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; Dependabot keeps them current.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # Integration tests start PostgreSQL through Docker (preinstalled on the
      # runner). With CI set, a missing Docker fails the run instead of skipping.
      - run: uv run pytest --cov --cov-report=term-missing

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists a PR's commits to scan them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_ENABLE_COMMENTS: false

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO_DB_PORT: "55432"
      DEMO_APP_PORT: "58501"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The demo must work from a clean checkout: seed both databases, start the app, and
      # wait until it reports healthy.
      - run: docker compose up --build --detach --wait app
      - run: curl --fail --silent http://localhost:58501/_stcore/health
      # Health only says the server is up. Render every page of the installed app
      # through app.py's navigation inside the image, against the seeded demo, and
      # fail on any exception, error message or missing-option-data notice.
      - name: Every page renders in the image
        run: |
          docker compose exec -T app python - <<'EOF'
          from pathlib import Path

          from streamlit.testing.v1 import AppTest

          import stock_dashboard

          app = Path(stock_dashboard.__file__).with_name("app.py")
          failed = []
          for view in [None, *sorted(p.name for p in app.with_name("views").glob("*.py"))]:
              at = AppTest.from_file(str(app), default_timeout=120).run()
              if view:
                  at.switch_page(f"views/{view}").run()
              problems = [e.message for e in at.exception] + [e.value for e in at.error]
              problems += [i.value for i in at.info if "Option data is not available" in i.value]
              heading = [h.value for h in (*at.title, *at.header)]
              print(view or "app.py", heading, problems or "ok")
              if problems or not heading:
                  failed.append(view or "app.py")
          raise SystemExit(f"Pages that failed: {failed}" if failed else None)
          EOF
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
